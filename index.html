<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건설 프로젝트 대시보드 (더미 데이터)</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1f2933; --muted:#6b7785; --primary:#1f5fbf; --ok:#2e9e6a; --warn:#e0a020; --bad:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:24px 32px; }
  header h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; opacity:.85; font-size:14px; }
  main { max-width:1000px; margin:24px auto; padding:0 16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:10px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card .label { color:var(--muted); font-size:13px; }
  .card .value { font-size:28px; font-weight:700; margin-top:6px; }
  .panel { background:var(--card); border-radius:10px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input, select { padding:8px 10px; border:1px solid #cbd2d9; border-radius:6px; font-size:14px; }
  input { flex:1; min-width:160px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #e4e7eb; }
  th { color:var(--muted); font-weight:600; }
  .bar { background:#e4e7eb; border-radius:4px; height:8px; width:100px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--primary); }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; color:#fff; }
  .진행중 { background:var(--primary); } .완료 { background:var(--ok); } .지연 { background:var(--bad); } .대기 { background:var(--warn); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>🏗️ 건설 프로젝트 대시보드</h1>
  <p>GitHub Pages 배포용 데모 · 모든 데이터는 더미입니다</p>
</header>
<main>
  <section class="cards" id="cards"></section>
  <section class="panel">
    <div class="toolbar">
      <input id="q" placeholder="현장명 검색…">
      <select id="status"><option value="">전체 상태</option><option>진행중</option><option>완료</option><option>지연</option><option>대기</option></select>
    </div>
    <table>
      <thead><tr><th>현장명</th><th>지역</th><th>공정률</th><th>예산(억)</th><th>상태</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<footer>© 2026 Dummy Construction Demo</footer>
<script>
const projects = [
  {name:"한강 리버뷰 타워", region:"서울", progress:72, budget:1250, status:"진행중"},
  {name:"부산 해운대 복합단지", region:"부산", progress:45, budget:2100, status:"진행중"},
  {name:"인천공항 물류센터", region:"인천", progress:100, budget:680, status:"완료"},
  {name:"대전 스마트 오피스", region:"대전", progress:30, budget:430, status:"지연"},
  {name:"광주 문화예술관", region:"광주", progress:0, budget:520, status:"대기"},
  {name:"수원 데이터센터", region:"경기", progress:88, budget:940, status:"진행중"},
  {name:"제주 리조트 리모델링", region:"제주", progress:100, budget:370, status:"완료"},
];
const $ = id => document.getElementById(id);
function render() {
  const q = $("q").value.trim(), s = $("status").value;
  const list = projects.filter(p => p.name.includes(q) && (!s || p.status === s));
  $("rows").innerHTML = list.map(p => `
    <tr><td>${p.name}</td><td>${p.region}</td>
    <td><div class="bar"><span style="width:${p.progress}%"></span></div> ${p.progress}%</td>
    <td>${p.budget.toLocaleString()}</td>
    <td><span class="badge ${p.status}">${p.status}</span></td></tr>`).join("")
    || `<tr><td colspan="5">결과 없음</td></tr>`;
}
const total = projects.reduce((a,p)=>a+p.budget,0);
const avg = Math.round(projects.reduce((a,p)=>a+p.progress,0)/projects.length);
$("cards").innerHTML = [
  ["전체 현장", projects.length+"곳"],
  ["총 예산", total.toLocaleString()+"억"],
  ["평균 공정률", avg+"%"],
  ["지연 현장", projects.filter(p=>p.status==="지연").length+"곳"],
].map(([l,v])=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
$("q").oninput = $("status").onchange = render;
render();
</script>
</body>
</html>
